apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: server-logs-pvc
  namespace: {{.Values.namespace}}
  annotations:
    # Helm 卸载时跳过此资源——日志是排障证据，不许被 uninstall 带走
    helm.sh/resource-policy: keep

spec:
  # 访问模式
  accessModes:
    - ReadWriteOnce

  # 申请 1Gi 存储空间
  resources:
    requests:
      storage: 1Gi

  # 指定 StorageClass
  storageClassName: {{.Values.pvc.storageClassName}}