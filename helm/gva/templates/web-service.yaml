apiVersion: v1
kind: Service

metadata:
  name: gva-web-service
  namespace: {{ .Values.namespace }}

spec:
  type: {{ .Values.web.type }}

  selector:
    app: gva-web

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
      nodePort: {{ .Values.web.nodePort }}