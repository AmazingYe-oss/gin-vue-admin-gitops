apiVersion: v1
kind: Service

metadata:
  name: server
  namespace: {{ .Values.namespace }}
  labels:
    app: gva-server

spec:
  type: ClusterIP

  selector:
    app: gva-server

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
