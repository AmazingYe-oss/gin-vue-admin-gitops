apiVersion: apps/v1
kind: Deployment

metadata:
  name: server-deployment
  namespace: {{ .Values.namespace}}
  labels:
    app: gva-server

spec:
  # Pod 副本数量
  replicas: {{ .Values.server.replicas }}

  # Deployment 如何找到它管理的 Pod
  selector:
    matchLabels:
      app: gva-server

  # Pod 模板
  template:
    metadata:
      labels:
        app: gva-server

    spec:
      containers:
        - name: gva-server
          image: {{ .Values.server.image }}
          imagePullPolicy: {{ .Values.server.imagePullPolicy}}

          # 容器端口
          ports:
          - name: http
            containerPort: {{ .Values.server.port }}
            protocol: TCP

          # 资源限制
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # 存活探针
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # 就绪探针
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3


          # 挂载 Volume
          volumeMounts:
            - name: server-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml

            - name: server-data
              mountPath: /app/data

            - name: server-logs
              mountPath: /app/log    

      # Volume
      volumes:
        - name: server-config
          configMap:
            name: server-config

        - name: server-data
          persistentVolumeClaim:
            claimName: {{ .Values.server.sqlitePvc}}

        - name: server-logs
          persistentVolumeClaim:
            claimName: {{ .Values.server.logsPvc}}     

      # 优雅终止时间
      terminationGracePeriodSeconds: 30

      # Pod 调度
      restartPolicy: Always