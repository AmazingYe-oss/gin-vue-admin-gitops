apiVersion: apps/v1
kind: Deployment

metadata:
  name: server-deployment
  namespace: {{ .Values.namespace}}
  labels:
    app: gva-server

spec:
  # Pod 副本数量
  replicas: {{ .Values.server.replicas }}

  # Deployment 如何找到它管理的 Pod
  selector:
    matchLabels:
      app: gva-server

  # Pod 模板
  template:
    metadata:
      labels:
        app: gva-server

    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: gva-server
          image: {{ .Values.server.image }}
          imagePullPolicy: {{ .Values.server.imagePullPolicy}}
          command: ["/bin/sh", "-c"]
          args:
            - |
              jwt_key=$(cat /app/secrets/signing-key)
              if [ -z "$jwt_key" ]; then
                echo "JWT signing key is empty. Exiting." >&2
                exit 1
              fi
              sed "s|_JWT_SIGNING_KEY_|$jwt_key|g" /app/config-template/config.yaml > /app/config/config.yaml
              if ! grep -q "$jwt_key" /app/config/config.yaml; then
                echo "ERROR: JWT key not found in rendered config" >&2
                exit 1
              fi
              exec tini -- /app/gva-server -c /app/config/config.yaml
          ports:
          - name: http
            containerPort: {{ .Values.server.port }}
            protocol: TCP

          # 资源限制
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # 存活探针
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # 就绪探针
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3


          # 挂载 Volume
          volumeMounts:
            - name: server-config-template
              mountPath: /app/config-template
              readOnly: true

            - name: server-config-rendered
              mountPath: /app/config

            - name: jwt-secret
              mountPath: /app/secrets
              readOnly: true

            - name: server-data
              mountPath: /app/data

            - name: server-logs
              mountPath: /app/log

      # Volume
      volumes:
        - name: server-config-template
          configMap:
            name: server-config
        - name: server-config-rendered
          emptyDir: 
            medium: Memory
            sizeLimit: 16Mi
        - name: jwt-secret
          secret:
            secretName: {{ .Values.server.jwtSigningKey.name }}
            items:
              - key: {{ .Values.server.jwtSigningKey.key }}
                path: signing-key     

        - name: server-data
          persistentVolumeClaim:
            claimName: {{ .Values.server.sqlitePvc}}

        - name: server-logs
          persistentVolumeClaim:
            claimName: {{ .Values.server.logsPvc}}  
                      

      # 优雅终止时间
      terminationGracePeriodSeconds: 30

      # Pod 调度
      restartPolicy: Always